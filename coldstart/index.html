<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cold Start</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#14161a;--fg:#e8e8ea;--mut:#8a8f98;--line:#2c3038;--card:#1c1f25;--acc:#6ea8fe;--ok:#4cc38a;--no:#f0616d}
@media (prefers-color-scheme:light){:root{--bg:#f5f5f3;--fg:#1a1c20;--mut:#676c75;--line:#d5d6da;--card:#fff;--acc:#2f6fd6;--ok:#1b8f58;--no:#cf3347}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,sans-serif}
#top{display:flex;gap:14px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line);font-size:14px;color:var(--mut);min-height:42px}
#clock{flex:1;height:4px;background:var(--line);border-radius:2px;overflow:hidden}
#clock i{display:block;height:100%;width:0;background:var(--acc)}
#end{display:none;padding:3px 10px;font-size:13px}
.run #end{display:block}
#stage{max-width:880px;margin:0 auto;padding:18px 14px 60px;display:flex;flex-direction:column;align-items:center;gap:14px}
h1{font-size:22px;margin:10px 0 0}
button{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 16px;cursor:pointer}
button.go{background:var(--acc);border-color:var(--acc);color:#fff;min-width:120px}
input[type=number]{font:inherit;width:5em;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--fg)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
.cap{color:var(--mut);font-size:14px;text-align:center}
.big{font-size:40px;font-weight:600}
.facts{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.st{display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.st.bad{border-color:var(--no)}
.gl{fill:var(--fg);margin-right:4px}
.tok{display:block;border-radius:5px}
.ok{color:var(--ok)}.no{color:var(--no)}
.ask{display:flex;align-items:center;gap:8px;font-size:22px}
.cards{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.card{display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px;border:1px solid var(--line);border-radius:10px}
.board{max-width:100%;height:auto}
.slot{fill:var(--card);stroke:var(--mut);stroke-width:1.5;cursor:pointer}
.edge{stroke:var(--mut);stroke-width:3;opacity:.6}
.arrow{fill:none;stroke:var(--acc);stroke-width:2.5}
.tray{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;min-height:54px;margin-bottom:8px}
.tray button{padding:5px}
.tray button.sel{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
#b{display:flex;flex-direction:column;align-items:center}
#c{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.chips{display:inline-flex;gap:6px}
.chips button{padding:5px 12px}
.chips button.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
.hist{font-size:13px;color:var(--mut);text-align:center;line-height:1.7}
</style>
</head>
<body>
<div id="top"><span id="info"></span><div id="clock"><i></i></div><button id="end">End</button></div>
<div id="stage"></div>
<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
